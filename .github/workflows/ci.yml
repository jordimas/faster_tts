name: CI

on:
  push:
  pull_request:

jobs:
  check-code-format:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir ruff

      - name: Check code style and imports with Ruff
        run: |
          python -m ruff check faster_tts/ tests/ benchmark/ scripts/

      - name: Check dependency lockfile
        run: |
          python -m pip install --no-cache-dir uv
          uv lock --check

      - name: Check code format with Ruff
        if: ${{ always() }}
        run: |
          python -m ruff format --check faster_tts/ tests/ benchmark/ scripts/

  check-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python dependencies and package
        run: |
          python -m pip install .
      - name: Run tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s benchmark -p 'test_*.py'

  check-api-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python dependencies and package
        run: |
          python -m pip install .
      - name: Check Markdown reference
        run: |
          python -m unittest discover -s tests -p test_docs.py
          python scripts/generate_docs.py
          git diff --exit-code -- docs/api.md

  publish-package-on-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check-code-format, check-tests, check-api-docs]
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: make check-release-version

      - name: Install build tools
        run: python -m pip install --no-cache-dir build twine

      - name: Build and check package
        run: make check-package

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
