name: CI

on:
  push:
  pull_request:

jobs:
  check-code-format:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir ruff

      - name: Check code style and imports with Ruff
        run: |
          python -m ruff check faster_tts/ tests/ benchmark/ scripts/

      - name: Check code format with Ruff
        if: ${{ always() }}
        run: |
          python -m ruff format --check faster_tts/ tests/ benchmark/ scripts/

  check-api-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Check Markdown reference
        run: |
          python -m unittest discover -s tests -p test_docs.py
          python scripts/generate_docs.py
          git diff --exit-code -- docs/api.md

  publish-package-on-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check-code-format
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as metadata:
              version = tomllib.load(metadata)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY

      - name: Install build tools
        run: python -m pip install --no-cache-dir build twine

      - name: Build and check package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
