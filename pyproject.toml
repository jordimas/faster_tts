[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-tts-ct2"
version = "0.0.1"
description = "Experimental Drama 3 inference through CTranslate2"
requires-python = ">=3.10"
dependencies = ["ctranslate2>=4.8.3", "numpy>=1.23", "tokenizers>=0.20", "huggingface-hub>=0.24"]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.24"]

[project.scripts]
faster-tts = "faster_tts.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faster_tts*"]

[tool.uv]
environments = ["python_version == '3.14'"]

[tool.uv.sources]
ctranslate2 = { path = "dist/ctranslate2-4.8.3+expertfix.1-cp314-cp314-linux_x86_64.whl" }
